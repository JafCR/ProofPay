[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofpay"
version = "0.1.0"
description = "ProofPay: an autonomous procurement agent with a deterministic release gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "mcp>=1.0",
]

# google-genai + google-adk + google-cloud-firestore are added by a later task.
# The [google] extra is reserved here so the pyproject is ready to extend without
# a restructure; keep runtime deps (SPEC R1-R3) out of the base install for now.
[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional runtime deps for the Gemini judge (SPEC R1/R2). judge.py imports
# google-genai lazily, so the package installs and its tests run without this.
# google-adk + google-cloud-firestore are added by later tasks.
google = ["google-genai>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/proofpay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

<!doctype html>
<!--
  ProofPay · mission trace viewer + demo home (SPEC §2.4).
  ONE self-contained static page, vanilla JS, no framework, no external requests.
  Served by the agent at "/". Consumes GET /missions/{id} (same origin), whose body is
  the MissionTrace pydantic model in agent/src/proofpay/models.py:
  { mission, wakes[], children? } (children is set for composite missions).

  How it picks what to load (in priority order):
    ?fixture=NAME  -> fetch fixtures/NAME.json  (static; no polling)
    ?src=URL       -> fetch URL                 (static; arbitrary JSON, handy for tests)
    ?mission=ID    -> fetch /missions/ID        (live; polls every 5s until terminal)
    ?id=ID         -> alias of ?mission
    (none)         -> the demo home: start buttons, pinned missions, finished examples,
                      and the "How ProofPay works" walkthrough.

  Extra flags:
    &fresh=1       -> the mission was just created from this page: play the Wake 1
                      story step by step (discover, compare, contract, fund, sleep)
                      instead of jumping straight to "Awaiting", and schedule one
                      real mid-sleep sweep so the trace shows the agent waking,
                      checking, and going back to sleep before delivery.

  Every field is read defensively: missing / null values degrade to a tidy
  placeholder, never a broken screen.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProofPay · Mission Trace</title>
<style>
  :root {
    --bg: #0A0E17;
    --panel: #111827;
    --panel-2: #0E1420;
    --border: #1E2740;
    --border-soft: #171f33;
    --ink: #E6EBF5;
    --ink-muted: #8A94A9;
    --ink-faint: #5A6379;
    --indigo: #4353FF;
    --cyan: #58E0FF;
    --ok: #34D399;
    --bad: #FF5C7A;
    --warn: #F5A524;
    --ok-bg: rgba(52, 211, 153, 0.12);
    --bad-bg: rgba(255, 92, 122, 0.12);
    --warn-bg: rgba(245, 165, 36, 0.12);
    --indigo-bg: rgba(67, 83, 255, 0.14);
    --cyan-bg: rgba(88, 224, 255, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(67, 83, 255, 0.12), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(88, 224, 255, 0.08), transparent 55%),
      var(--bg);
    color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 0 20px 80px;
  }
  a { color: var(--cyan); }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  code, .mono { font-size: 0.9em; }

  /* Top bar */
  header.top {
    display: flex; align-items: center; gap: 14px;
    padding: 22px 2px 18px; border-bottom: 1px solid var(--border-soft); margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
  .brand:hover .logo { filter: brightness(1.15); }
  .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--indigo), var(--cyan));
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 6px 20px rgba(67,83,255,0.35);
    display: grid; place-items: center; font-weight: 800; color: #05070d; font-size: 15px;
  }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: 0.2px; font-weight: 700; }
  .brand .sub { color: var(--ink-muted); font-size: 12px; margin-top: 1px; }
  .top .spacer { flex: 1; }
  .live {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; background: var(--panel-2);
  }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
  .live.on .dot { background: var(--cyan); box-shadow: 0 0 0 0 rgba(88,224,255,0.6); animation: pulse 1.8s infinite; }
  .live.final .dot { background: var(--ok); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(88,224,255,0.5);} 70%{ box-shadow: 0 0 0 7px rgba(88,224,255,0);} 100%{ box-shadow:0 0 0 0 rgba(88,224,255,0);} }

  /* Cards */
  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 12px 30px rgba(0,0,0,0.25);
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--cyan);
    margin: 0 0 14px; font-weight: 700;
  }
  .card h2 .hint { color: var(--ink-faint); text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11px; margin-left: 8px; }

  .reveal { animation: fadeUp 0.5s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Mission head */
  .goal { font-size: 20px; font-weight: 650; line-height: 1.35; margin: 2px 0 14px; }
  .facts { display: flex; flex-wrap: wrap; gap: 10px 26px; color: var(--ink-muted); font-size: 13px; }
  .facts b { color: var(--ink); font-weight: 600; }
  .facts .k { color: var(--ink-faint); margin-right: 6px; text-transform: uppercase; font-size: 11px; letter-spacing: 0.6px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 650; border: 1px solid transparent; white-space: nowrap; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); border-color: rgba(52,211,153,0.3); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); border-color: rgba(255,92,122,0.3); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); border-color: rgba(245,165,36,0.3); }
  .badge.info { color: var(--cyan); background: var(--cyan-bg); border-color: rgba(88,224,255,0.3); }
  .badge.indigo { color: #aeb7ff; background: var(--indigo-bg); border-color: rgba(67,83,255,0.4); }
  .badge.muted { color: var(--ink-muted); background: rgba(138,148,169,0.1); border-color: var(--border); }
  .badge.lg { font-size: 14px; padding: 6px 14px; }

  /* Status timeline */
  .timeline { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 0 2px; }
  .tl-node { flex: 1 1 0; min-width: 92px; text-align: center; position: relative; padding: 0 4px; }
  .tl-node:not(:first-child)::before {
    content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: var(--border);
  }
  .tl-node.reached:not(:first-child)::before { background: linear-gradient(90deg, var(--indigo), var(--cyan)); }
  .tl-dot {
    position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 8px;
    background: var(--panel-2); border: 2px solid var(--border); display: grid; place-items: center;
    font-size: 12px; color: var(--ink-faint);
  }
  .tl-node.reached .tl-dot { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-bg); }
  .tl-node.current .tl-dot { border-color: var(--cyan); color: #05070d; background: var(--cyan);
    box-shadow: 0 0 0 4px rgba(88,224,255,0.18); }
  .tl-node.term-ok .tl-dot { border-color: var(--ok); color: #05070d; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-bg); }
  .tl-node.term-bad .tl-dot { border-color: var(--bad); color: #fff; background: var(--bad); box-shadow: 0 0 0 4px var(--bad-bg); }
  .tl-label { font-size: 10.5px; letter-spacing: 0.3px; color: var(--ink-faint); text-transform: uppercase; }
  .tl-node.reached .tl-label { color: var(--ink); }
  .tl-node.current .tl-label { color: var(--cyan); font-weight: 700; }
  .tl-node.term-ok .tl-label { color: var(--ok); font-weight: 700; }
  .tl-node.term-bad .tl-label { color: var(--bad); font-weight: 700; }

  /* Story banner */
  .story {
    display: flex; gap: 12px; align-items: flex-start;
    background: linear-gradient(180deg, var(--indigo-bg), var(--panel-2));
    border: 1px solid rgba(67,83,255,0.35); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 18px; font-size: 14px;
  }
  .story .ic { font-size: 20px; line-height: 1.3; }
  .story .t { font-weight: 700; margin-bottom: 3px; }
  .story p { margin: 0; color: var(--ink-muted); }

  /* Working / progress line for the staged Wake 1 reveal */
  .working {
    display: flex; align-items: center; gap: 10px; color: var(--cyan);
    font-size: 13.5px; padding: 14px 18px; margin-bottom: 18px;
    border: 1px dashed rgba(88,224,255,0.4); border-radius: 12px; background: var(--cyan-bg);
  }
  .working .spin {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(88,224,255,0.25); border-top-color: var(--cyan);
    animation: spin 0.9s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Offer cards */
  .offers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .offer {
    position: relative; border: 1px solid var(--border-soft); border-radius: 12px;
    padding: 12px 14px; background: var(--panel-2); font-size: 13px;
  }
  .offer.chosen { border-color: rgba(88,224,255,0.55); box-shadow: 0 0 0 3px rgba(88,224,255,0.12); }
  .offer .oname { font-weight: 700; font-size: 13.5px; margin-bottom: 1px; padding-right: 54px; }
  .offer .otitle { color: var(--ink-faint); font-size: 12px; line-height: 1.4; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .offer .orow { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-top: 1px solid var(--border-soft); }
  .offer .orow span { color: var(--ink-faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .offer .orow b { font-weight: 650; }
  .offer .hired { position: absolute; top: 10px; right: 10px; }
  .offer .why { margin-top: 8px; font-size: 11.5px; color: var(--ink-faint); border-top: 1px dashed var(--border-soft); padding-top: 7px; }
  .offer.chosen .why { color: var(--cyan); }
  .rationale { color: var(--ink); background: var(--panel-2); border: 1px solid var(--border-soft);
    border-left: 3px solid var(--indigo); border-radius: 8px; padding: 10px 13px; margin: 14px 0 0; font-size: 14px; }

  /* Wake */
  .wake-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .wake-head .wid { font-weight: 700; font-size: 15px; }
  .wake-meta { color: var(--ink-muted); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; margin: 6px 0 14px; }
  .wake-meta .k { color: var(--ink-faint); }

  .sleep {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin: -4px 0 18px;
    color: var(--cyan); font-size: 12.5px; letter-spacing: 0.3px;
  }
  .sleep .line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(88,224,255,0.4), transparent); }
  .sleep .zzz { border: 1px dashed rgba(88,224,255,0.4); border-radius: 999px; padding: 3px 12px; background: var(--cyan-bg); white-space: nowrap; }

  .demo-note {
    color: var(--ink-muted); font-size: 12.5px; background: var(--warn-bg);
    border: 1px solid rgba(245,165,36,0.25); border-radius: 10px; padding: 9px 13px; margin: -6px 0 18px;
  }
  .demo-note b { color: var(--warn); }

  /* Proof checks table */
  .table-scroll { overflow-x: auto; border: 1px solid var(--border-soft); border-radius: 10px; }
  table.proofs { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  table.proofs th { text-align: left; color: var(--ink-faint); font-weight: 600; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.6px; padding: 9px 12px; background: var(--panel-2);
    border-bottom: 1px solid var(--border); }
  table.proofs td { padding: 10px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  table.proofs tr:last-child td { border-bottom: none; }
  .kind-cmp { display: flex; align-items: center; gap: 6px; }
  .kind-cmp .arrow { color: var(--ink-faint); }
  .kind.match { color: var(--ok); }
  .kind.mismatch { color: var(--bad); font-weight: 650; }
  .kind.none { color: var(--ink-faint); }
  .llm-reason { color: var(--ink-muted); font-size: 12px; margin-top: 3px; max-width: 320px; }
  .ref-cell { color: var(--ink); }
  .empty-note { color: var(--ink-faint); font-size: 13px; padding: 10px 2px; }

  /* Policy verdict */
  .verdict-box { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 14px;
    padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2); }
  .verdict-box.ok { border-color: rgba(52,211,153,0.4); background: linear-gradient(180deg, var(--ok-bg), var(--panel-2)); }
  .verdict-box.bad { border-color: rgba(255,92,122,0.4); background: linear-gradient(180deg, var(--bad-bg), var(--panel-2)); }
  .verdict-box.warn { border-color: rgba(245,165,36,0.4); background: linear-gradient(180deg, var(--warn-bg), var(--panel-2)); }
  .verdict-box .vlabel { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-faint); }
  .verdict-box .vmain { font-size: 20px; font-weight: 800; letter-spacing: 0.3px; }
  .verdict-box.ok .vmain { color: var(--ok); }
  .verdict-box.bad .vmain { color: var(--bad); }
  .verdict-box.warn .vmain { color: var(--warn); }
  .preds { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .pchip { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 7px;
    background: var(--bad-bg); color: var(--bad); border: 1px solid rgba(255,92,122,0.35); cursor: help; }

  /* Actions & model */
  .subgrid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
  @media (min-width: 720px) { .subgrid { grid-template-columns: 1.5fr 1fr; } }
  .mini-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--ink-faint); margin: 0 0 8px; }
  .actions { display: grid; gap: 6px; }
  .action { display: flex; align-items: baseline; gap: 9px; font-size: 12.5px; padding: 6px 10px;
    background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 8px; }
  .action .tool { font-family: ui-monospace, monospace; color: var(--cyan); font-weight: 600; white-space: nowrap; }
  .action .tick { font-size: 12px; }
  .action .detail { color: var(--ink-muted); }
  .action .args { color: var(--ink-faint); font-family: ui-monospace, monospace; font-size: 11.5px; }
  .model-usage { font-size: 13px; color: var(--ink-muted); }
  .model-usage .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border-soft); }
  .model-usage .row:last-child { border-bottom: none; }
  .model-usage b { color: var(--ink); }

  /* Composite (coordinated) missions */
  .kids { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .kids { grid-template-columns: 1fr 1fr; } }
  .kid { border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px 16px; background: var(--panel-2); }
  .kid .kgoal { font-weight: 650; font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
  .kid .kmeta { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--ink-muted); align-items: center; }
  .kid .kopen { margin-top: 10px; font-size: 13px; }

  /* Home: hero + demo launchers */
  .hero { text-align: center; padding: 26px 10px 8px; }
  .hero h3 { font-size: 26px; margin: 8px 0 10px; line-height: 1.25; }
  .hero p.lead { color: var(--ink-muted); max-width: 640px; margin: 0 auto 8px; font-size: 15px; }
  .launchers { display: grid; gap: 14px; grid-template-columns: 1fr; margin: 22px 0 6px; }
  @media (min-width: 720px) { .launchers { grid-template-columns: 1fr 1fr; } }
  .launcher { text-align: left; display: flex; flex-direction: column; gap: 8px; }
  .launcher .lt { font-weight: 700; font-size: 15.5px; }
  .launcher .ld { color: var(--ink-muted); font-size: 13px; flex: 1; }
  .startbtn {
    background: linear-gradient(135deg, var(--indigo), #5a68ff); color: #fff; border: none;
    border-radius: 9px; padding: 11px 18px; font-size: 14px; font-weight: 650; cursor: pointer; width: 100%;
  }
  .startbtn:hover { filter: brightness(1.1); }
  .startbtn:disabled { opacity: 0.6; cursor: default; }
  .fineprint { color: var(--ink-faint); font-size: 12px; text-align: center; margin: 10px auto 0; max-width: 620px; }

  /* Pinned missions + curated examples */
  .pins { display: grid; gap: 10px; }
  .pin { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border-soft);
    border-radius: 12px; background: var(--panel-2); text-decoration: none; color: inherit; }
  .pin:hover { border-color: rgba(88,224,255,0.4); }
  .pin.latest { border-color: rgba(88,224,255,0.55); box-shadow: 0 0 0 3px rgba(88,224,255,0.10); }
  .pin .pt { flex: 1; min-width: 0; }
  .pin .pgoal { font-weight: 650; font-size: 13.5px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .pin .ptldr { color: var(--ink-muted); font-size: 12.5px; line-height: 1.45; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pin .pside { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
  .pin .pwhen { color: var(--ink-faint); font-size: 11px; white-space: nowrap; }

  /* How it works journey illustration */
  .journey {
    display: block; width: 100%; height: auto; margin: 6px 0 4px;
    border-radius: 12px; border: 1px solid var(--border-soft);
    background: #0A0E17;
  }
  .howcopy { color: var(--ink-muted); font-size: 13.5px; max-width: 760px; margin: 14px auto 0; }
  .howcopy b { color: var(--ink); }

  /* States: prompt / notfound / error */
  .center-state { max-width: 460px; margin: 60px auto; text-align: center; }
  .center-state .big { font-size: 40px; margin-bottom: 8px; }
  .center-state h3 { margin: 6px 0; font-size: 18px; }
  .center-state p { color: var(--ink-muted); }
  .idform { display: flex; gap: 8px; margin-top: 14px; }
  .idform input { flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--ink);
    border-radius: 9px; padding: 11px 13px; font-size: 14px; }
  .idform input:focus { outline: none; border-color: var(--indigo); }
  .idform button, .retry { background: linear-gradient(135deg, var(--indigo), #5a68ff); color: #fff; border: none;
    border-radius: 9px; padding: 11px 18px; font-size: 14px; font-weight: 650; cursor: pointer; }
  .idform button:hover, .retry:hover { filter: brightness(1.1); }
  .starterr { color: #ff7a7a; font-size: 13px; min-height: 18px; text-align: center; margin: 8px 0 0; }
  footer { text-align: center; color: var(--ink-faint); font-size: 11.5px; margin-top: 30px; }

  /* Theme toggle */
  .iconbtn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--ink-muted);
    border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center;
    cursor: pointer; font-size: 15px; line-height: 1; padding: 0;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--indigo); }
  .ghlink {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--ink-muted);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 600;
    text-decoration: none; white-space: nowrap;
  }
  .ghlink:hover { color: var(--cyan); border-color: var(--cyan); }

  /* Collapsible card header */
  .card h2.toggle { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; }
  .card h2.toggle .chev { margin-left: auto; color: var(--ink-faint); font-size: 13px; }
  .card h2.toggle:hover .chev { color: var(--cyan); }

  /* Light theme */
  html[data-theme="light"] {
    --bg: #F3F5FB;
    --panel: #FFFFFF;
    --panel-2: #F4F6FC;
    --border: #D9DFEF;
    --border-soft: #E7EBF6;
    --ink: #171C2E;
    --ink-muted: #525C74;
    --ink-faint: #8A93A8;
    --indigo: #3D4CE0;
    --cyan: #0787B8;
    --ok: #0E9F6E;
    --bad: #DE2C4D;
    --warn: #B45309;
    --ok-bg: rgba(14, 159, 110, 0.10);
    --bad-bg: rgba(222, 44, 77, 0.10);
    --warn-bg: rgba(180, 83, 9, 0.10);
    --indigo-bg: rgba(61, 76, 224, 0.10);
    --cyan-bg: rgba(7, 135, 184, 0.10);
  }
  html[data-theme="light"] body {
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(67, 83, 255, 0.07), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(7, 135, 184, 0.05), transparent 55%),
      var(--bg);
  }
  html[data-theme="light"] .card {
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 24px rgba(23,28,46,0.07);
  }
  html[data-theme="light"] .badge.indigo { color: var(--indigo); }
  html[data-theme="light"] .tl-node.term-bad .tl-dot { color: #fff; }

</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="/" title="ProofPay home">
      <div class="logo">P</div>
      <div>
        <h1>ProofPay</h1>
        <div class="sub">autonomous procurement · mission trace</div>
      </div>
    </a>

    <div id="live" class="live"><span class="dot"></span><span id="live-text">idle</span></div>
  </header>

  <main id="app"><!-- rendered here --></main>

  <footer>
    ProofPay re-checks every proof itself before it releases payment. The AI can flag a problem, but it can't force a payout.
    · <a href="https://github.com/JafCR/ProofPay" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>
</div>

<script>
"use strict";

// ------------------------------------------------------------------ helpers
const $ = (id) => document.getElementById(id);
const app = $("app");

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const qs = (name) => new URLSearchParams(location.search).get(name);

function fmtTime(iso) {
  if (!iso) return "·";
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
}
function fmtDuration(ms) {
  if (ms === null || ms === undefined || isNaN(ms) || ms < 0) return null;
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), sec = s % 60;
  if (m < 60) return `${m}m ${sec}s`;
  const h = Math.floor(m / 60), min = m % 60;
  if (h < 24) return `${h}h ${min}m`;
  const days = Math.floor(h / 24), hr = h % 24;
  return `${days}d ${hr}h`;
}
function money(usd) {
  if (usd === null || usd === undefined || isNaN(usd)) return "·";
  return "$" + Number(usd).toLocaleString();
}
const sleepMs = (ms) => new Promise((r) => setTimeout(r, ms));

// ------------------------------------------------------------------ theme
const THEME_KEY = "proofpay.theme";
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const btn = $("themebtn");
  if (btn) btn.textContent = theme === "light" ? "🌙" : "☀️";
}
function toggleTheme() {
  let current = "dark";
  try { current = localStorage.getItem(THEME_KEY) || "dark"; } catch {}
  const next = current === "light" ? "dark" : "light";
  try { localStorage.setItem(THEME_KEY, next); } catch {}
  applyTheme(next);
}
try { applyTheme(localStorage.getItem(THEME_KEY) || "dark"); } catch { applyTheme("dark"); }

// ------------------------------------------------------------------ render flags
// Entry animations play on the first paint and during the staged Wake 1 replay
// only. Poll-driven re-renders must not replay them (that reads as blinking),
// and a poll that brings no new data must not touch the DOM at all.
let animate = true;
let lastRaw = null;
const rv = () => (animate ? " reveal" : "");

// Collapsible "Offers the agent weighed" panel (state survives re-renders).
const OFFERS_KEY = "proofpay.offersOpen";
let offersOpen = (() => { try { return localStorage.getItem(OFFERS_KEY) !== "0"; } catch { return true; } })();
function toggleOffers() {
  offersOpen = !offersOpen;
  try { localStorage.setItem(OFFERS_KEY, offersOpen ? "1" : "0"); } catch {}
  const body = $("offers-body");
  if (body) body.style.display = offersOpen ? "" : "none";
  const chev = $("offers-chev");
  if (chev) chev.textContent = offersOpen ? "▾ hide" : "▸ show";
}

// Plain-language meaning of each release check, shown as a tooltip on the P1..P5 chips.
const PREDICATE_TITLES = {
  P1: "P1: every step of the job has a proof attached",
  P2: "P2: every registry proof was re-checked against the registry just now, and a record came back",
  P3: "P3: each proof is the right kind of record for its step",
  P4: "P4: the AI reviewer didn't flag any proof (it can only flag a proof, never approve payment on its own)",
  P5: "P5: the escrow holds enough to cover the payment",
};

const TERMINAL = new Set(["RELEASED", "DISPUTED"]);
const CORE_STATES = ["CREATED", "CONTRACTED", "FUNDED", "AWAITING_DELIVERY", "VERIFYING"];
const STATE_SHORT = {
  CREATED: "Created", CONTRACTED: "Contracted", FUNDED: "Funded",
  AWAITING_DELIVERY: "Awaiting", VERIFYING: "Verifying",
  RELEASED: "Released", DISPUTED: "Disputed",
};

// ------------------------------------------------------------------ demo config
// The two missions a visitor can launch live. The provider "works" for about
// DEMO_WORK_SECONDS while the agent genuinely sleeps.
const DEMO_WORK_SECONDS = 45;
const LIVE_DEMOS = {
  hotel: {
    label: "🏨 Hire a law firm (registry proofs)",
    goal: "Form a company in Costa Rica to purchase land in Guanacaste and operate a hotel. Budget $6,000.",
    budget: 6000,
    blurb: "The agent hires a Costa Rican law firm to form a hotel-ready company. Four steps, each anchored to a public registry certificate the agent re-verifies before paying.",
    tldr: "Company formation with 4 registry-anchored proofs. The agent re-verifies each certificate at the source before releasing payment.",
    story: "A foreign investor wants a small hotel in Guanacaste. Before any money moves, a company must exist in Costa Rica that can legally own land and operate lodging. ProofPay got the goal and a $6,000 budget: it compared providers on the Pacta marketplace, hired the law firm with the most collateral at stake, funded escrow and went to sleep. When the firm files the paperwork, the agent wakes up, re-checks every registry certificate itself, and only then pays.",
  },
  ecotour: {
    label: "🌴 Book an eco-tour (no registry, collateral-backed)",
    goal: "Design and book a 7-day eco-tour itinerary to scout hotel locations near Costa Rican national parks. Budget $1,500.",
    budget: 1500,
    blurb: "A different kind of job: a local tour operator scouts locations near the national parks. No public registry backs an itinerary, so staked collateral, escrow and delivery checks protect the deal instead.",
    tldr: "A tourism job with free-text deliverables. Protected by the operator's staked collateral and escrow rather than registry records.",
    story: "The same investor needs to walk the ground before buying anything. ProofPay books a 7-day scouting itinerary with a local eco-tour operator. There is no public registry for an itinerary, so this mission shows the other half of the trust model: the operator has real collateral staked on the marketplace, escrow only releases when every step is delivered, and the agent still sleeps through the work and wakes on delivery.",
  },
};

// Finished missions a judge can explore without running anything. The ids point
// at real missions executed against this deployment; TLDRs are two quick lines,
// the story is the short narrative shown on the trace page.
const CURATED = [
  {
    id: "4f869f2e1e814c3e95cf7fba0f1cda34",
    live: true,
    icon: "😴",
    title: "The long sleep: a 40-hour mission, settled on its own",
    tldr: "A hire with a multi-day delivery window. The agent genuinely slept 40 hours across 10 wakes, then re-verified everything and paid on its own.",
    story: "Every demo on this page compresses the wait to about 45 seconds. This mission did not. The agent hired a second law firm and then genuinely went to sleep: no process running, no polling loop, just a persisted trace. Every few hours the scheduled sweep briefly woke it; it checked the engagement, found no delivery yet, and went back to sleep — eight times over 40 hours. When the firm finally delivered, one last wake re-verified every proof and released the payment. Look at the wake log below: the sleep gaps are measured in hours, not seconds.",
  },
  {
    id: "6d81574d763c4cc2b3402b27d20cb000",
    outcome: "RELEASED",
    icon: "✅",
    title: "Honest delivery, payment released",
    tldr: "A Tamarindo restaurant company, formed and proven with 4 registry certificates. All checks passed and escrow released.",
    story: "A chef from San José asked ProofPay to set up a beachfront restaurant company in Tamarindo. The law firm delivered all four filings; the agent woke on delivery, re-verified every registry certificate at the source, ran the five release checks, and paid. This is the happy path end to end.",
  },
  {
    id: "76335c19b58c4f6aa890c93607191c3a",
    outcome: "DISPUTED",
    icon: "🚫",
    title: "Registry drift caught, payment withheld",
    tldr: "A certificate was annulled at the registry after submission. The agent's own re-check got a 404, refused to pay, and the provider's stake was slashed.",
    story: "A provider submitted what looked like a complete filing for a marina holding company; the platform verified every reference at submission time. Then one certificate was annulled at the registry (registry drift). At payment time the agent re-checked every reference itself, got a 404 on the revoked one, failed check P2, withheld payment and opened a dispute. The arbiter refunded the buyer and slashed $1,000 from the provider's stake.",
  },
  {
    id: "c18d50e79fd24194bc9e01d208505806",
    outcome: "RELEASED",
    icon: "🧩",
    title: "Two jobs, one coordinated mission",
    tldr: "ProofPay split one goal into two independent hires (legal + tourism), ran both through Pacta, and reported complete only when both verified and paid.",
    story: "One goal, two trades: open a boutique hotel means forming the company (a law firm) and scouting the ground (a tour operator). ProofPay hired both through Pacta as independent engagements, each with its own contract, escrow and verification. The coordinated mission only completes when every job settles; a single bad delivery would flip the whole thing into a dispute.",
  },
];

// ------------------------------------------------------------------ my-missions pinboard (localStorage)
const PIN_KEY = "proofpay.myMissions";

function loadPins() {
  try { return JSON.parse(localStorage.getItem(PIN_KEY)) || []; } catch { return []; }
}
function savePins(pins) {
  try { localStorage.setItem(PIN_KEY, JSON.stringify(pins.slice(0, 8))); } catch {}
}
function pinMission(entry) {
  const pins = loadPins().filter((p) => p.id !== entry.id);
  pins.unshift(entry);
  savePins(pins);
}
function updatePinStatus(id, status) {
  const pins = loadPins();
  const hit = pins.find((p) => p.id === id);
  if (hit && hit.status !== status) { hit.status = status; savePins(pins); }
}
function storyFor(missionId) {
  const curated = CURATED.find((c) => c.id === missionId);
  if (curated) return { title: curated.title, text: curated.story };
  const pin = loadPins().find((p) => p.id === missionId);
  if (pin && pin.demo && LIVE_DEMOS[pin.demo]) {
    return { title: "This mission's story", text: LIVE_DEMOS[pin.demo].story };
  }
  return null;
}

// ------------------------------------------------------------------ loader
let pollTimer = null;
let currentUrl = null;
let staticMode = false;
let currentMissionId = null;

function setLive(mode, text) {
  const box = $("live");
  box.className = "live" + (mode ? " " + mode : "");
  $("live-text").textContent = text;
}

async function loadFrom(url, isStatic, label) {
  currentUrl = url;
  staticMode = isStatic;
  await refresh(label);
}

async function fetchTrace() {
  const res = await fetch(currentUrl, { headers: { accept: "application/json" }, cache: "no-store" });
  return res;
}

async function refresh(label) {
  try {
    const res = await fetchTrace();
    if (res.status === 404) { renderNotFound(label); setLive("", "not found"); stopPolling(); return; }
    if (!res.ok) { renderError(`Server returned HTTP ${res.status}`, label); setLive("", "error"); stopPolling(); return; }
    const data = await res.json();
    const raw = JSON.stringify(data);
    if (raw !== lastRaw) {
      renderTrace(data);
      afterRender(data);
      lastRaw = raw;
      animate = false; // later re-renders swap content without replaying entry animations
    }
    const status = (data && data.mission && data.mission.status) || "";
    const now = new Date().toLocaleTimeString();
    if (staticMode) { setLive("final", `static · ${label || "fixture"}`); stopPolling(); }
    else if (TERMINAL.has(status)) { setLive("final", `final · ${status} · ${now}`); stopPolling(); }
    else { setLive("on", `live · updated ${now}`); schedulePoll(label); }
  } catch (e) {
    renderError(String(e && e.message || e), label);
    setLive("", "error");
    stopPolling();
  }
}
function schedulePoll(label) {
  stopPolling();
  pollTimer = setTimeout(() => refresh(label), 5000);
}
function stopPolling() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }

// Post-render bookkeeping: keep the pinboard in sync and, for a freshly started
// mission, fire one REAL mid-sleep sweep so the trace shows the agent waking,
// finding no delivery, and going back to sleep (at least three wakes total).
function afterRender(data) {
  const mission = data && data.mission;
  if (!mission || !mission.mission_id) return;
  if (loadPins().some((p) => p.id === mission.mission_id)) {
    updatePinStatus(mission.mission_id, mission.status);
  }
  maybeScheduleSweep(mission);
}

let sweepTimer = null;
function maybeScheduleSweep(mission) {
  if (!isFresh || staticMode) return;
  if (mission.status !== "AWAITING_DELIVERY") return;
  const key = "proofpay.swept." + mission.mission_id;
  if (sessionStorage.getItem(key) || sweepTimer) return;
  sweepTimer = setTimeout(async () => {
    sessionStorage.setItem(key, "1");
    try { await fetch("/sweep", { method: "POST" }); } catch {}
  }, 15000);
}

// ------------------------------------------------------------------ render: trace
function renderTrace(data, opts) {
  const mission = (data && data.mission) || {};
  if (Array.isArray(data && data.children) && data.children.length) {
    app.innerHTML = renderComposite(data);
    return;
  }
  const wakes = Array.isArray(data && data.wakes) ? data.wakes : [];
  const parts = [];
  parts.push(renderHead(mission));
  const story = storyFor(mission.mission_id);
  if (story) parts.push(renderStory(story));
  parts.push(renderTimeline(mission.status));
  parts.push(renderOffersSection(mission));
  parts.push(renderWakes(wakes, mission.status));
  app.innerHTML = parts.join("");
}

function statusBadge(status, lg = true) {
  const cls = status === "RELEASED" ? "ok" : status === "DISPUTED" ? "bad"
    : status === "VERIFYING" ? "info" : status === "AWAITING_DELIVERY" ? "warn" : "indigo";
  return `<span class="badge ${lg ? "lg " : ""}${cls}">${esc(status || "·")}</span>`;
}

function renderStory(story) {
  return `
    <section class="story${rv()}">
      <div class="ic">📖</div>
      <div>
        <div class="t">${esc(story.title)}</div>
        <p>${esc(story.text)}</p>
      </div>
    </section>`;
}

function renderHead(m) {
  const provider = m.provider_name ? `<span><span class="k">Provider</span><b>${esc(m.provider_name)}</b></span>` : "";
  const offer = m.offer_id ? `<span><span class="k">Offer</span><b>#${esc(m.offer_id)}</b></span>` : "";
  const eng = m.engagement_id ? `<span><span class="k">Engagement</span><b>#${esc(m.engagement_id)}</b></span>` : "";
  return `
    <section class="card${rv()}">
      <div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;">
        <div style="flex:1;min-width:260px;">
          <h2>Mission <span class="hint mono">${esc(m.mission_id || "·")}</span></h2>
          <div class="goal">${esc(m.goal || "(no goal recorded)")}</div>
        </div>
        <div>${statusBadge(m.status)}</div>
      </div>
      <div class="facts">
        <span><span class="k">Budget</span><b>${money(m.budget_usd)}</b></span>
        ${provider}${offer}${eng}
        <span><span class="k">Created</span><b>${fmtTime(m.created_at)}</b></span>
        <span><span class="k">Updated</span><b>${fmtTime(m.updated_at)}</b></span>
      </div>
    </section>`;
}

function renderTimeline(status) {
  const isTerminal = TERMINAL.has(status);
  const coreIdx = CORE_STATES.indexOf(status);
  const reachedUpTo = isTerminal ? CORE_STATES.length - 1 : coreIdx;

  const nodes = CORE_STATES.map((st, i) => {
    const reached = i <= reachedUpTo;
    const current = !isTerminal && i === coreIdx;
    const cls = ["tl-node", reached ? "reached" : "", current ? "current" : ""].join(" ").trim();
    const mark = reached ? (current ? "●" : "✓") : (i + 1);
    return `<div class="${cls}"><div class="tl-dot">${mark}</div><div class="tl-label">${esc(STATE_SHORT[st])}</div></div>`;
  });

  // Terminal outcome node.
  let termCls = "tl-node", termLabel = "Release / Dispute", termMark = "?";
  if (status === "RELEASED") { termCls += " reached term-ok"; termLabel = "Released"; termMark = "✓"; }
  else if (status === "DISPUTED") { termCls += " reached term-bad"; termLabel = "Disputed"; termMark = "✕"; }
  nodes.push(`<div class="${termCls}"><div class="tl-dot">${termMark}</div><div class="tl-label">${esc(termLabel)}</div></div>`);

  return `<section class="card${rv()}"><h2>Status timeline</h2><div class="timeline">${nodes.join("")}</div></section>`;
}

// Offers the agent actually weighed (mission.offers_considered), as cards.
// Falls back to the older rejected-list rendering for traces recorded before
// the snapshot existed.
function renderOffersSection(m, forceOpen = false) {
  const sel = m.selection;
  const cards = Array.isArray(m.offers_considered) ? m.offers_considered : [];
  if (!cards.length) return sel ? renderSelectionLegacy(sel) : "";
  const open = forceOpen || offersOpen;
  const reasons = {};
  if (sel && Array.isArray(sel.rejected)) {
    for (const r of sel.rejected) reasons[String(r.offer_id)] = r.reason || "";
  }
  const sorted = [...cards].sort((a, b) => (b.chosen === true) - (a.chosen === true));
  const cardHtml = sorted.map((c) => {
    const why = c.chosen
      ? `<div class="why">✓ hired for this mission</div>`
      : (reasons[String(c.offer_id)] ? `<div class="why">${esc(reasons[String(c.offer_id)])}</div>` : "");
    return `
      <div class="offer${c.chosen ? " chosen" : ""}">
        ${c.chosen ? `<span class="badge info hired">hired</span>` : ""}
        <div class="oname">${esc(c.provider_name || ("Offer #" + c.offer_id))}</div>
        <div class="otitle">${esc(c.title || "")}</div>
        <div class="orow"><span>Price</span><b>${money(c.price_usd)}</b></div>
        <div class="orow"><span>Collateral at stake</span><b>${c.collateral_usd ? money(c.collateral_usd) : "none"}</b></div>
        <div class="orow"><span>Vetted</span><b>${c.vetted ? "✓ yes" : "✕ no"}</b></div>
        <div class="orow"><span>Track record</span><b>${esc(shortRating(c.rating))}</b></div>
        ${why}
      </div>`;
  }).join("");
  return `
    <section class="card${rv()}">
      <h2 class="toggle" onclick="toggleOffers()">Offers the agent weighed
        <span class="hint">collateral and track record outrank price</span>
        <span class="chev" id="offers-chev">${open ? "▾ hide" : "▸ show"}</span>
      </h2>
      <div id="offers-body"${open ? "" : ' style="display:none"'}>
        <div class="offers-grid">${cardHtml}</div>
        ${sel && sel.rationale ? `<div class="rationale">${esc(sel.rationale)}</div>` : ""}
      </div>
    </section>`;
}

function shortRating(r) {
  if (!r) return "·";
  const m = /(\d+)\s*good\s*\/\s*(\d+)\s*bad/i.exec(String(r));
  return m ? `${m[1]} 👍 · ${m[2]} 👎` : String(r);
}

function renderSelectionLegacy(sel) {
  const rejected = Array.isArray(sel.rejected) ? sel.rejected : [];
  const rejHtml = rejected.length
    ? `<div class="mini-h" style="margin-top:12px">Passed over</div><div class="actions">${rejected.map((r) =>
        `<div class="action"><span class="tool">Offer #${esc(r.offer_id)}</span><span class="detail">${esc(r.reason || "·")}</span></div>`).join("")}</div>`
    : "";
  return `
    <section class="card${rv()}">
      <h2>Why this provider <span class="hint">how the agent picked</span></h2>
      <div style="margin-bottom:8px"><span class="badge info lg">Chosen · Offer #${esc(sel.offer_id || "·")}</span></div>
      ${sel.rationale ? `<div class="rationale" style="margin-top:0">${esc(sel.rationale)}</div>` : ""}
      ${rejHtml}
    </section>`;
}

function renderWakes(wakes, missionStatus) {
  if (!wakes.length) {
    return `<section class="card${rv()}"><h2>Wakes</h2><div class="empty-note">No wake cycles recorded yet.</div></section>`;
  }
  const out = [];
  for (let i = 0; i < wakes.length; i++) {
    if (i > 0) {
      const gap = sleepGap(wakes[i - 1], wakes[i]);
      if (gap) out.push(`<div class="sleep"><span class="line"></span><span class="zzz">💤 agent slept ${esc(gap)}</span><span class="line"></span></div>`);
    }
    out.push(renderWake(wakes[i], i));
  }
  if (missionStatus === "AWAITING_DELIVERY") {
    out.push(`
      <div class="sleep"><span class="line"></span><span class="zzz">💤 the agent is asleep right now</span><span class="line"></span></div>
      <div class="demo-note"><b>Demo note:</b> the provider "works" for about ${DEMO_WORK_SECONDS} seconds in this demo,
      so the whole story fits in a minute or two. In production this same sleep can last days: the agent process is
      genuinely idle until a delivery event or a scheduled sweep wakes it.</div>`);
  }
  return out.join("");
}

function sleepGap(prev, cur) {
  const a = prev && (prev.finished_at || prev.started_at);
  const b = cur && cur.started_at;
  if (!a || !b) return null;
  const d = fmtDuration(new Date(b) - new Date(a));
  return d;
}

const TRIGGER_BADGE = {
  create: ["indigo", "create"], pubsub: ["info", "pub/sub delivery"], sweep: ["warn", "scheduler sweep"],
};

function renderWake(w, idx) {
  const trig = TRIGGER_BADGE[w.trigger] || ["muted", w.trigger || "·"];
  const dur = (w.started_at && w.finished_at) ? fmtDuration(new Date(w.finished_at) - new Date(w.started_at)) : null;
  const checks = Array.isArray(w.proof_checks) ? w.proof_checks : [];
  const actions = Array.isArray(w.actions) ? w.actions : [];
  const isWait = w.policy && w.policy.verdict === "WAIT";

  return `
    <section class="card${rv()}">
      <div class="wake-head">
        <span class="wid">Wake ${idx + 1}</span>
        <span class="badge ${trig[0]}">${esc(trig[1])}</span>
        <span class="hint mono" style="color:var(--ink-faint)">${esc(w.wake_id || "")}</span>
      </div>
      <div class="wake-meta">
        <span><span class="k">Started</span> ${fmtTime(w.started_at)}</span>
        <span><span class="k">Finished</span> ${w.finished_at ? fmtTime(w.finished_at) : "in progress"}</span>
        ${dur ? `<span><span class="k">Duration</span> ${esc(dur)}</span>` : ""}
      </div>
      ${isWait ? "" : renderProofs(checks)}
      ${renderVerdict(w.policy)}
      ${renderSubgrid(actions, w.model)}
    </section>`;
}

function verifyBadge(pc) {
  // A record returned this wake -> verified (drives P2). No verify_error in that case.
  if (pc.verified === true) return `<span class="badge ok">✓ verified</span>`;
  // Failure reason: prefer the current field `verify_error` (not_found | unavailable | null);
  // tolerate the earlier `verify_outcome` field so a mid-migration payload still renders.
  const legacy = pc.verify_outcome && pc.verify_outcome !== "ok" && pc.verify_outcome !== "not_checked" ? pc.verify_outcome : null;
  const err = pc.verify_error || legacy;
  if (err === "not_found") return `<span class="badge bad">✕ not found (404)</span>`;
  if (err === "unavailable") return `<span class="badge warn">registry unavailable (502)</span>`;
  // Not verified, no error: either a proof that was never checked, or a step with no proof.
  return pc.ref ? `<span class="badge muted">not checked</span>` : `<span class="badge muted">text proof</span>`;
}

function renderProofs(checks) {
  if (!checks.length) {
    return `<div class="empty-note">No proofs submitted in this wake.</div>`;
  }
  const rows = checks.map((pc) => {
    const req = pc.required_kind || "";
    const ret = pc.returned_kind;
    let kindCmp;
    if (!req && !ret) {
      kindCmp = `<span class="kind none">free-text deliverable</span>`;
    } else if (!ret) {
      kindCmp = `<span class="kind none">${esc(req)}</span> <span class="arrow">→</span> <span class="kind none">·</span>`;
    } else if (ret === req) {
      kindCmp = `<span class="kind none">${esc(req)}</span> <span class="arrow">→</span> <span class="kind match">${esc(ret)} ✓</span>`;
    } else {
      kindCmp = `<span class="kind none">${esc(req)}</span> <span class="arrow">→</span> <span class="kind mismatch">${esc(ret)} ✕</span>`;
    }
    let llm;
    if (pc.llm_satisfies === true) llm = `<span class="badge ok">✓ looks valid</span>`;
    else if (pc.llm_satisfies === false) llm = `<span class="badge bad">✕ flagged</span>`;
    else llm = `<span class="badge muted">·</span>`;
    const reason = pc.llm_reason ? `<div class="llm-reason">${esc(pc.llm_reason)}</div>` : "";
    return `
      <tr>
        <td><b>${esc(pc.step_id || "·")}</b></td>
        <td><div class="kind-cmp">${kindCmp}</div></td>
        <td class="ref-cell mono">${pc.ref ? esc(pc.ref) : '<span class="kind none">no ref</span>'}</td>
        <td>${verifyBadge(pc)}</td>
        <td>${llm}${reason}</td>
      </tr>`;
  });
  return `
    <div class="table-scroll">
      <table class="proofs">
        <thead><tr>
          <th>Step</th><th>Required → returned kind</th><th>Registry ref</th><th>Verify</th><th>AI review</th>
        </tr></thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>`;
}

function renderVerdict(policy) {
  if (!policy || !policy.verdict) {
    return `<div class="verdict-box warn"><div><div class="vlabel">Payment decision</div><div class="vmain" style="color:var(--ink-muted)">None yet</div></div>
      <div style="color:var(--ink-muted);font-size:13px">No payment decision was made in this wake.</div></div>`;
  }
  const v = policy.verdict;
  if (v === "WAIT") {
    return `<div class="verdict-box warn"><div><div class="vlabel">Payment decision</div><div class="vmain">WAIT</div></div>
      <div style="color:var(--ink-muted);font-size:13px">The agent woke, checked the engagement, found no delivery yet, and went back to sleep. No funds moved.</div></div>`;
  }
  const failed = Array.isArray(policy.failed_predicates) ? policy.failed_predicates : [];
  const cls = v === "RELEASE" ? "ok" : v === "DISPUTE" ? "bad" : "warn";
  const chips = failed.length
    ? `<div class="preds"><span class="vlabel">Failed checks</span>${failed.map((p) =>
        `<span class="pchip" title="${esc(PREDICATE_TITLES[p] || p)}">${esc(p)}</span>`).join("")}</div>`
    : `<div class="preds"><span class="badge ok">all checks passed</span></div>`;
  return `
    <div class="verdict-box ${cls}">
      <div><div class="vlabel">Payment decision</div><div class="vmain">${esc(v)}</div></div>
      ${chips}
    </div>`;
}

function renderSubgrid(actions, model) {
  const actionsHtml = actions.length
    ? `<div class="actions">${actions.map((a) => {
        const tick = a.ok === false ? `<span class="tick" style="color:var(--bad)">✕</span>` : `<span class="tick" style="color:var(--ok)">✓</span>`;
        const args = a.args && Object.keys(a.args).length ? `<span class="args">${esc(JSON.stringify(a.args))}</span>` : "";
        const detail = a.detail ? `<span class="detail">${esc(a.detail)}</span>` : "";
        return `<div class="action">${tick}<span class="tool">${esc(a.tool || "?")}</span>${args}${detail}</div>`;
      }).join("")}</div>`
    : `<div class="empty-note">No tool calls recorded.</div>`;

  let modelHtml = `<div class="empty-note">No model usage recorded.</div>`;
  if (model && (model.name || model.tokens_in || model.tokens_out)) {
    modelHtml = `<div class="model-usage">
      <div class="row"><span>Model</span><b>${esc(model.name || "·")}</b></div>
      <div class="row"><span>Tokens in</span><b>${esc(Number(model.tokens_in || 0).toLocaleString())}</b></div>
      <div class="row"><span>Tokens out</span><b>${esc(Number(model.tokens_out || 0).toLocaleString())}</b></div>
    </div>`;
  }
  return `
    <div class="subgrid">
      <div><div class="mini-h">Tool calls</div>${actionsHtml}</div>
      <div><div class="mini-h">Model usage</div>${modelHtml}</div>
    </div>`;
}

// ------------------------------------------------------------------ render: composite
function renderComposite(data) {
  const m = data.mission || {};
  const kids = data.children || [];
  const story = storyFor(m.mission_id);
  const kidsHtml = kids.map((k) => {
    const km = k.mission || {};
    return `
      <div class="kid">
        <div class="kgoal">${esc(km.goal || "·")}</div>
        <div class="kmeta">
          ${statusBadge(km.status, false)}
          ${km.provider_name ? `<span>🏢 ${esc(km.provider_name)}</span>` : ""}
          <span>💰 ${money(km.budget_usd)}</span>
          <span>${(k.wakes || []).length} wake${(k.wakes || []).length === 1 ? "" : "s"}</span>
        </div>
        <div class="kopen"><a href="?mission=${encodeURIComponent(km.mission_id)}">Open this job's full trace →</a></div>
      </div>`;
  }).join("");
  return `
    ${renderHead(m)}
    ${story ? renderStory(story) : ""}
    ${renderTimeline(m.status)}
    <section class="card${rv()}">
      <h2>Coordinated jobs <span class="hint">each hired independently through Pacta</span></h2>
      <p style="color:var(--ink-muted);font-size:13.5px;margin:0 0 14px">
        ProofPay split this goal into ${kids.length} independent hires, each with its own contract, escrow
        and verification. The mission reports complete only when <b>every</b> job verifies and pays;
        one bad delivery disputes the whole coordination.
      </p>
      <div class="kids">${kidsHtml}</div>
    </section>`;
}

// ------------------------------------------------------------------ staged Wake 1 reveal (fresh missions)
// The mission is created synchronously, but a visitor should SEE the agent work:
// discover, compare, contract, fund, then sleep. We replay Wake 1 as short
// stages over the real recorded trace, then drop into normal live polling.
async function playFreshStory(data, label) {
  const mission = (data && data.mission) || {};
  const composite = Array.isArray(data && data.children) && data.children.length > 0;
  const story = storyFor(mission.mission_id);
  const S = (html) => { app.innerHTML = html; };
  const working = (text) => `<div class="working reveal"><span class="spin"></span>${esc(text)}</div>`;
  const head = renderHead(mission);
  const storyHtml = story ? renderStory(story) : "";
  setLive("on", "replaying Wake 1");

  S(head + storyHtml + renderTimeline("CREATED") + working("Searching the Pacta marketplace for providers..."));
  await sleepMs(1700);

  const undecided = (mission.offers_considered || []).map((c) => ({ ...c, chosen: false }));
  const offers = composite ? "" : renderOffersSection({ ...mission, selection: null, offers_considered: undecided }, true);
  S(head + storyHtml + renderTimeline("CREATED") + offers +
    working("Comparing offers: collateral and track record outrank price..."));
  await sleepMs(1900);

  const offersFull = composite ? "" : renderOffersSection(mission, true);
  S(head + storyHtml + renderTimeline("CONTRACTED") + offersFull +
    working("Signing the contract on Pacta (both parties, hash-chained record)..."));
  await sleepMs(1700);

  S(head + storyHtml + renderTimeline("FUNDED") + offersFull +
    working("Funding escrow with the downpayment..."));
  await sleepMs(1700);

  // Hand over to the live renderer (real status, wakes, disclaimer, polling).
  history.replaceState(null, "", "?mission=" + encodeURIComponent(mission.mission_id));
  isFresh = true; // keep the mid-sleep sweep scheduling active
  renderTrace(data);
  afterRender(data);
  lastRaw = JSON.stringify(data); // the first poll should not repaint unchanged data
  animate = false;
  const status = mission.status || "";
  if (TERMINAL.has(status)) setLive("final", `final · ${status}`);
  else { setLive("on", "live"); schedulePoll(label); }
}

// ------------------------------------------------------------------ render: home
function renderHome() {
  stopPolling();
  const launchers = Object.entries(LIVE_DEMOS).map(([key, d]) => `
    <div class="card launcher">
      <div class="lt">${esc(d.label)}</div>
      <div class="ld">${esc(d.blurb)}</div>
      <button class="startbtn" id="start-${esc(key)}" onclick="startDemoMission('${esc(key)}')">▶ Start this mission</button>
    </div>`).join("");

  const pins = loadPins();
  const pinsHtml = pins.length ? `
    <section class="card">
      <h2>Your missions <span class="hint">started from this browser · newest first</span></h2>
      <div class="pins">${pins.map((p, i) => `
        <a class="pin${i === 0 ? " latest" : ""}" href="?mission=${encodeURIComponent(p.id)}">
          <div class="pt">
            <div class="pgoal">${i === 0 ? "⭐ " : ""}${esc(p.goal)}</div>
            <div class="ptldr">${esc(p.tldr || tldrForPin(p))}</div>
          </div>
          <div class="pside">
            ${statusBadge(p.status || "·", false)}
            <span class="pwhen">${p.started ? fmtTime(p.started) : ""}</span>
          </div>
        </a>`).join("")}</div>
    </section>` : "";

  const curatedCards = CURATED.filter((c) => c.id && !c.id.startsWith("CURATED_"));
  const curatedHtml = curatedCards.length ? `
    <section class="card">
      <h2>Explore real missions <span class="hint">actual runs against this deployment · click to open the full trace</span></h2>
      <div class="pins">${curatedCards.map((c) => `
        <a class="pin" href="?mission=${encodeURIComponent(c.id)}">
          <div style="font-size:20px">${c.icon}</div>
          <div class="pt">
            <div class="pgoal">${esc(c.title)}</div>
            <div class="ptldr">${esc(c.tldr)}</div>
          </div>
          <div class="pside">${c.live
            ? `<span class="badge warn" id="cur-${esc(c.id)}">💤 sleeping</span>`
            : statusBadge(c.outcome, false)}</div>
        </a>`).join("")}</div>
    </section>` : "";

  app.innerHTML = `
    <div class="hero">
      <h3>Watch an AI agent hire a business,<br/>sleep through the work, verify, and pay</h3>
      <p class="lead">ProofPay is an autonomous procurement agent on the Pacta Protocol marketplace.
        Give it a goal and a budget; it hires a real provider, funds escrow, goes to sleep,
        and only pays after re-checking every proof itself. A deterministic policy gate holds
        the money; the AI can veto a payment but never force one.</p>
    </div>
    <div class="launchers">${launchers}</div>
    <p class="fineprint">Each demo takes about 2 minutes: the provider "works" for ~${DEMO_WORK_SECONDS} seconds while
      the agent genuinely sleeps, then a delivery event wakes it to verify and settle. This page follows the whole story live.</p>
    <p id="starterr" class="starterr"></p>
    ${pinsHtml}
    ${curatedHtml}
    ${renderHowItWorks()}
    <section class="card">
      <h2>Open a mission by id</h2>
      <form class="idform" onsubmit="return goToMission(event)">
        <input id="mid" type="text" placeholder="mission id" autocomplete="off" />
        <button type="submit">Open</button>
      </form>
    </section>`;
  setLive("", "idle");
  refreshPinStatuses(pins);
  refreshCuratedStatuses();
}

// Live curated cards (e.g. the multi-day mission) show their real current
// status instead of a hardcoded outcome.
async function refreshCuratedStatuses() {
  for (const c of CURATED.filter((x) => x.live && x.id)) {
    try {
      const r = await fetch(`/missions/${encodeURIComponent(c.id)}`, { cache: "no-store" });
      if (!r.ok) continue;
      const t = await r.json();
      const s = t && t.mission && t.mission.status;
      const el = $("cur-" + c.id);
      if (s && el) el.outerHTML = statusBadge(s, false);
    } catch {}
  }
}

function tldrForPin(p) {
  if (p.demo && LIVE_DEMOS[p.demo]) return LIVE_DEMOS[p.demo].tldr;
  return "A mission you started on this deployment. Open it to see every wake, proof check and the payment decision.";
}

// Refresh pinned statuses in the background so the pinboard stays truthful.
async function refreshPinStatuses(pins) {
  let changed = false;
  for (const p of pins.slice(0, 5)) {
    if (TERMINAL.has(p.status)) continue;
    try {
      const r = await fetch(`/missions/${encodeURIComponent(p.id)}`, { cache: "no-store" });
      if (!r.ok) continue;
      const t = await r.json();
      const s = t && t.mission && t.mission.status;
      if (s && s !== p.status) { updatePinStatus(p.id, s); changed = true; }
    } catch {}
  }
  if (changed && !qs("mission") && !qs("id") && !qs("fixture") && !qs("src")) renderHome();
}

function renderHowItWorks() {
  return `
    <section class="card">
      <h2>How ProofPay works <span class="hint">give it a goal, walk away</span></h2>
      <img class="journey" src="/fixtures/how-proofpay-works.jpg"
           alt="The ProofPay journey: you give it a goal, it hires and funds escrow, it sleeps for real, a delivery wakes it, it re-checks every proof itself, and code decides between paid and disputed" />
      <p class="howcopy">
        Pacta Protocol gives businesses and AI agents a shared marketplace: staked collateral for trust,
        escrow for money, and a public registry for proofs. <b>ProofPay is the buyer side, automated end to
        end</b>: one autonomous agent runs Discover, Contract, Verify and Settle on its own, and genuinely
        sleeps while the provider delivers. In between, the process exits; a delivery event (Pub/Sub) or a
        scheduled sweep wakes it back up. The last word on money is never the model's:
        a deterministic five-check policy gate (P1..P5) is the only code path that can release escrow.
      </p>
    </section>`;
}

// ------------------------------------------------------------------ actions
async function startDemoMission(key) {
  const demo = LIVE_DEMOS[key];
  if (!demo) return;
  const btn = $("start-" + key);
  if (btn) { btn.disabled = true; btn.textContent = "Hiring a provider..."; }
  try {
    const r = await fetch("/missions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ goal: demo.goal, budget_usd: demo.budget }),
    });
    if (!r.ok) {
      throw new Error(r.status === 401
        ? "This deployment requires a demo token; use the demo scripts instead."
        : "The agent could not start the mission (HTTP " + r.status + ").");
    }
    const trace = await r.json();
    const id = trace.mission.mission_id;
    pinMission({
      id, demo: key, goal: demo.goal, tldr: demo.tldr,
      status: trace.mission.status, started: new Date().toISOString(),
    });
    location.search = "?mission=" + encodeURIComponent(id) + "&fresh=1";
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "▶ Start this mission"; }
    const err = $("starterr");
    if (err) err.textContent = e.message || String(e);
  }
}

function goToMission(ev) {
  ev.preventDefault();
  const id = ($("mid").value || "").trim();
  if (id) location.search = "?mission=" + encodeURIComponent(id);
  return false;
}
function renderNotFound(label) {
  app.innerHTML = `
    <div class="center-state">
      <div class="big">🕳️</div>
      <h3>Mission not found</h3>
      <p>No mission matched <span class="mono">${esc(label || "")}</span>. It may not exist yet, or the id is wrong.</p>
      <button class="retry" onclick="location.href='/'">Back to home</button>
    </div>`;
}
function renderError(msg, label) {
  app.innerHTML = `
    <div class="center-state">
      <div class="big">⚠️</div>
      <h3>Could not load trace</h3>
      <p>${esc(msg)}</p>
      <button class="retry" onclick="location.reload()">Retry</button>
    </div>`;
}

// ------------------------------------------------------------------ boot
let isFresh = false;

async function boot() {
  const fixture = qs("fixture");
  const src = qs("src");
  const missionId = qs("mission") || qs("id");
  isFresh = qs("fresh") === "1";
  if (fixture) return loadFrom(`fixtures/${encodeURIComponent(fixture)}.json`, true, `fixture:${fixture}`);
  if (src) return loadFrom(src, true, src);
  if (missionId) {
    currentUrl = `/missions/${encodeURIComponent(missionId)}`;
    currentMissionId = missionId;
    if (isFresh) {
      try {
        const res = await fetchTrace();
        if (res.ok) return playFreshStory(await res.json(), missionId);
      } catch {}
      // Fall back to the plain live view if the replay could not load.
    }
    return loadFrom(currentUrl, false, missionId);
  }
  renderHome();
}
window.addEventListener("DOMContentLoaded", boot);
// exposed for inline handlers
window.renderHome = renderHome;
window.goToMission = goToMission;
window.startDemoMission = startDemoMission;
window.toggleTheme = toggleTheme;
window.toggleOffers = toggleOffers;
</script>
